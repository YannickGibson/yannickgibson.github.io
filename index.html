<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- highlight.js dark theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Site styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icons/favicon.ico">
    <title>Yannick Daniel Gibson</title>
</head>
<body>
    <!-- Particles background -->
    <div id="particles"></div>
    <div id="vignette"></div>
    <div id="cursor-spotlight"></div>

    <!-- Floating pill nav -->
    <nav class="pill-nav">
        <a href="#hero">Home</a>
        <a href="#projects">Projects</a>
        <a href="#games">Games</a>
        <span class="pill-nav-divider"></span>
        <a href="https://github.com/YannickGibson" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <i class="fab fa-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/yannick-gibson" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
        </a>
    </nav>

    <!-- Hero -->
    <section id="hero">
        <div class="container">
            <div class="row align-items-center hero-row">
                <div class="col-lg-7 center verticalHorizonCenter animate-on-scroll">
                    <h1 class="name-heading"><b>Yannick Daniel Gibson</b></h1>
                    <h2 class="mt-3">Portfolio</h2>
                    <hr class="hero-divider">
                    <p class="basic-text mt-3">I am <span class="animate"></span></p>
                    <a href="#projects" class="cta-btn mt-4">
                        <i class="fas fa-arrow-down"></i> Explore Projects
                    </a>
                </div>
                <div class="col-lg-5 verticalHorizonCenter animate-on-scroll">
                    <img class="hero-img" src="assets/media/programmer.svg" alt="Developer illustration">
                </div>
            </div>
        </div>
    </section>

    <!-- Projects -->
    <section id="projects">
        <div class="container">
            <h2 class="section-title animate-on-scroll">
                <i class="fas fa-code"></i> Projects
            </h2>
            <p class="section-subtitle animate-on-scroll">Click a project to read its README — fetched live from GitHub.</p>
            <div class="projects-grid" id="projects-grid">
                <!-- Populated dynamically by readme-loader.js -->
            </div>
        </div>
    </section>

    <!-- Games -->
    <section id="games">
        <div class="container">
            <h2 class="section-title animate-on-scroll">
                <i class="fas fa-gamepad"></i> Try my games, now!
            </h2>
            <div id="games-grid">
                <!-- Populated dynamically by subapps.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container center">
            <a href="https://github.com/YannickGibson" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/yannick-gibson" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-linkedin"></i>
            </a>
            <p>&copy; 2026 Yannick Daniel Gibson</p>
        </div>
    </footer>

    <!-- README Modal -->
    <div class="readme-modal" id="readmeModal">
        <div class="readme-modal-backdrop"></div>
        <div class="readme-modal-content">
            <button class="readme-modal-close" aria-label="Close">&times;</button>
            <div class="readme-modal-body"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/particles.js"></script>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.11"></script>
    <!-- Markdown rendering stack -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- Project config + loader -->
    <script src="js/projects.js"></script>
    <script src="js/readme-loader.js"></script>
    <!-- Subapps config + loader -->
    <script src="js/subapps.js"></script>
    <script>
        (function () {
            var container = document.getElementById('games-grid');
            if (!container || typeof SUBAPPS === 'undefined') return;
            SUBAPPS.forEach(function (app) {
                var card = document.createElement('a');
                card.href = 'player.html?app=' + encodeURIComponent(app.path);
                card.className = 'game-card animate-on-scroll';
                card.innerHTML =
                    (app.image ? '<img class="game-card-thumb" src="' + app.image + '" alt="' + app.title + '">' : '') +
                    '<div class="game-card-body">' +
                    '  <span class="game-card-title">' + app.title + '</span>' +
                    '  <span class="game-card-desc">' + app.description + '</span>' +
                    '  <span class="game-card-play"><i class="fas fa-play"></i> Play</span>' +
                    '</div>';
                container.appendChild(card);
            });
        })();
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <!-- Typed.js init -->
    <script>
        new Typed('.animate', {
            strings: [
                "a python developer (4 YOE).",
                "a computer vision researcher.",
                "a fast learner.",
                "a ML engineer.",
                "focused on impact.",
                "doing things that matter."
            ],
            typeSpeed: 50,
            backSpeed: 50,
            loop: true
        });
    </script>
</body>
</html>
