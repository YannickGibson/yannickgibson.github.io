<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Bootstrap 5.3 -->

    <!-- ══════════ OPTION D: Three-Phase Letter Rain ══════════ -->
    <style>
      /* ── Rain canvas: starts as opaque overlay, transitions to background ── */
      #rain-canvas {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        background: #0a0e1a;
      }

      /* ── D3: Elastic Slide-In ── */
      .intro-hidden {
        opacity: 0;
        transform: translateX(-60px);
      }

      .intro-hidden-right {
        opacity: 0;
        transform: translateX(60px);
      }

      .intro-slide-left {
        animation: slideFromLeft 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes slideFromLeft {
        0%   { opacity: 0; transform: translateX(-60px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      .intro-slide-right {
        animation: slideFromRight 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes slideFromRight {
        0%   { opacity: 0; transform: translateX(60px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      .intro-reveal {
        animation: slideFromLeft 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Nav slide down */
      .pill-nav.intro-hidden {
        opacity: 0;
        transform: translateX(-50%) translateY(-25px);
      }
      .pill-nav.intro-nav-reveal {
        animation: navSlideDown 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes navSlideDown {
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }

      /* Skip hint */
      .skip-hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: rgba(0, 210, 255, 0.35);
        letter-spacing: 2px;
        font-family: 'Courier New', monospace;
        z-index: 10001;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      .skip-hint.hidden { opacity: 0; }

      /* Accessibility */
      @media (prefers-reduced-motion: reduce) {
        #rain-canvas, .skip-hint { display: none !important; }
        .intro-hidden, .intro-hidden-right { opacity: 1 !important; transform: none !important; }
        .pill-nav.intro-hidden { opacity: 1 !important; transform: translateX(-50%) !important; }
      }
    </style>
</head>
<body>

    <div class="skip-hint" id="skip-hint">CLICK OR PRESS ANY KEY TO SKIP</div>
    <div id="vignette"></div>

        <a href="https://www.linkedin.com/in/yannick-gibson" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">

    </nav>

    <!-- Hero -->
    <section id="hero">

                    <a href="https://www.linkedin.com/in/yannick-gibson" target="_blank" rel="noopener noreferrer" class="contact-cta mt-4 intro-hidden" id="hero-cta1">
                        <i class="fab fa-linkedin"></i> Contact Me!
                    </a>
                    <a href="#projects" class="cta-btn mt-3 intro-hidden" id="hero-cta2">
                        <i class="fas fa-arrow-down"></i> Explore Projects
                    </a>
                </div>
                <div class="col-lg-5 verticalHorizonCenter animate-on-scroll">

                </div>
            </div>
        </div>
    </section>

    <!-- Projects -->
    <section id="projects">

            <a href="https://www.linkedin.com/in/yannick-gibson" target="_blank" rel="noopener noreferrer">

    <!-- README Modal -->

    <!-- Scripts (app.js replaced: particles removed, only cursor spotlight kept) -->
    <script>
    (function () {
      var spot = document.getElementById('cursor-spotlight');
      if (!spot) return;
      document.addEventListener('mousemove', function (e) {
        spot.style.opacity = '1';
        spot.style.background =
          'radial-gradient(circle 220px at ' + e.clientX + 'px ' + e.clientY + 'px, ' +
          'rgba(0, 210, 255, 0.07) 0%, transparent 100%)';
      });
      document.addEventListener('mouseleave', function () {
        spot.style.opacity = '0';
      });
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/readme-loader.js"></script>
    <script src="js/subapps.js"></script>
    <script>
        (function () {
            var container = document.getElementById('games-grid');
            if (!container || typeof SUBAPPS === 'undefined') return;
            SUBAPPS.forEach(function (app) {
                var card = document.createElement('a');
                card.href = 'player.html?app=' + encodeURIComponent(app.path);
                card.className = 'game-card animate-on-scroll';
                card.innerHTML =
                    (app.image ? '<img class="game-card-thumb" src="' + app.image + '" alt="' + app.title + '">' : '') +
                    '<div class="game-card-body">' +
                    '  <span class="game-card-title">' + app.title + '</span>' +
                    '  <span class="game-card-desc">' + app.description + '</span>' +
                    '  <span class="game-card-play"><i class="fas fa-play"></i> Play</span>' +
                    '</div>';
                container.appendChild(card);
            });
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <!-- ══════════ THREE-PHASE LETTER RAIN ══════════ -->
    <script>
    (function () {
      /* ── Reduced-motion bail-out ───────────────────────── */
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var canvas = document.getElementById('rain-canvas');
      if (!canvas) return;
      var ctx  = canvas.getContext('2d');
      var hint = document.getElementById('skip-hint');

      /* ── Phase timing (ms) ─────────────────────────────── */
      var T_FAST_END     = 1800;   /* fast rain ends            */
      var T_DECEL_END    = 4800;   /* deceleration completes    */
      var T_REVEAL_START = 3200;   /* content begins appearing  */

      /* ── Visual tuning ─────────────────────────────────── */
      var FONT_SIZE     = 15;
      var SPEED_FAST    = 1.0 * FONT_SIZE;
      var SPEED_AMBIENT = 0.12 * FONT_SIZE;
      var LEAD_FAST     = 0.85;
      var LEAD_AMBIENT  = 0.40;
      var FADE_FAST     = 0.10;
      var FADE_AMBIENT  = 0.04;

      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'.split('');

      /* ── Canvas sizing ─────────────────────────────────── */
      var dpr = window.devicePixelRatio || 1;
      var w, h, columns;
      var dropPos;

      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width  = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width  = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initColumns();
      }

      function initColumns() {
        var n = Math.ceil(w / FONT_SIZE);
        var old = dropPos || [];
        dropPos = [];
        for (var i = 0; i < n; i++) {
          dropPos[i] = (i < old.length) ? old[i] : -Math.random() * h;
        }
        columns = n;
      }

      resize();
      window.addEventListener('resize', resize);

      /* ── Helpers ───────────────────────────────────────── */
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

      /* ── State ─────────────────────────────────────────── */
      var startTime  = performance.now();
      var revealed   = false;
      var bgCleared  = false;
      var skipped    = false;

      /* ── Main draw loop ────────────────────────────────── */
      function draw() {
        var elapsed = performance.now() - startTime;

        /* Eased progress through deceleration (0 → 1) */
        var t     = clamp01((elapsed - T_FAST_END) / (T_DECEL_END - T_FAST_END));
        var eased = easeOutCubic(t);

        var curSpeed = lerp(SPEED_FAST, SPEED_AMBIENT, eased);
        var curLead  = lerp(LEAD_FAST, LEAD_AMBIENT, eased);
        var curFade  = lerp(FADE_FAST, FADE_AMBIENT, eased);

        /* ─ Trail fade: cross-fade dark-fill ↔ destination-out ─ */
        var darkW  = 1 - eased;
        var clearW = eased;

        if (darkW > 0.001) {
          ctx.fillStyle = 'rgba(15, 23, 42, ' + (curFade * darkW).toFixed(4) + ')';
          ctx.fillRect(0, 0, w, h);
        }
        if (clearW > 0.001) {
          ctx.save();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.globalAlpha = curFade * clearW;
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }

        /* ─ Canvas CSS background: opaque → transparent ─ */
        if (!bgCleared) {
          var bgAlpha = 1 - eased;
          if (bgAlpha > 0.001) {
            canvas.style.background = 'rgba(10, 14, 26, ' + bgAlpha.toFixed(3) + ')';
          } else {
            canvas.style.background = 'transparent';
            canvas.style.zIndex = '0';
            bgCleared = true;
          }
        }

        /* ─ Draw rain columns ─ */
        ctx.font = FONT_SIZE + 'px Courier New';
        for (var i = 0; i < columns; i++) {
          dropPos[i] += curSpeed;
          var x = i * FONT_SIZE;
          var y = dropPos[i];

          if (y > -FONT_SIZE && y < h + FONT_SIZE) {
            ctx.fillStyle = 'rgba(0, 210, 255, ' + curLead.toFixed(3) + ')';
            ctx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y);

            if (y > FONT_SIZE) {
              ctx.fillStyle = 'rgba(0, 210, 255, ' + (curLead * 0.25).toFixed(4) + ')';
              ctx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y - FONT_SIZE);
            }
          }

          if (y > h && Math.random() > 0.975) {
            dropPos[i] = -Math.random() * FONT_SIZE * 5;
          }
        }

        /* ─ Content reveal trigger ─ */
        if (!revealed && elapsed > T_REVEAL_START) {
          revealed = true;
          if (hint) hint.classList.add('hidden');
          revealHero();
        }

        requestAnimationFrame(draw);
      }

      /* ── Returning visitor → skip to ambient ───────────── */
      if (sessionStorage.getItem('intro-d-played')) {
        showContentNow();
        goAmbient();
      }
      requestAnimationFrame(draw);

      /* ── Show content instantly (no animation) ─────────── */
      function showContentNow() {
        if (hint) hint.remove();

        var nav = document.querySelector('.pill-nav');
        nav.classList.remove('intro-hidden');
        nav.style.opacity = '1';
        nav.style.transform = 'translateX(-50%)';

        ['hero-name','hero-sub','hero-hr','hero-cta1','hero-cta2','hero-img'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) { el.classList.remove('intro-hidden'); el.classList.remove('intro-hidden-right'); el.style.opacity = '1'; el.style.transform = 'none'; }
        });
      }

      /* ── Jump to ambient state ─────────────────────────── */
      function goAmbient() {
        startTime = performance.now() - T_DECEL_END - 1000;
        canvas.style.background = 'transparent';
        canvas.style.zIndex = '0';
        bgCleared = true;
        revealed  = true;
        /* Scatter drops across the full screen so it looks pre-filled */
        for (var i = 0; i < columns; i++) {
          dropPos[i] = Math.random() * h;
        }
        sessionStorage.setItem('intro-d-played', '1');
      }

      /* ── D3: Elastic Slide-In reveal ─────────────────── */
      function revealHero() {
        document.removeEventListener('click', skipAll);
        document.removeEventListener('keydown', skipAll);

        /* Name slides from left */
        var name = document.getElementById('hero-name');
        if (name) { name.classList.remove('intro-hidden'); name.classList.add('intro-slide-left'); }

        /* Image slides from right */
        setTimeout(function () {
          var img = document.getElementById('hero-img');
          if (img) { img.classList.remove('intro-hidden-right'); img.classList.add('intro-slide-right'); }
        }, 200);

        /* Rest stagger from left */
        var stagger = [
          { id: 'hero-sub',  delay: 300 },
          { id: 'hero-hr',   delay: 480 },
          { id: 'hero-cta1', delay: 620 },
          { id: 'hero-cta2', delay: 750 }
        ];

        stagger.forEach(function (item) {
          setTimeout(function () {
            var el = document.getElementById(item.id);
            if (el) { el.classList.remove('intro-hidden'); el.classList.add('intro-reveal'); }
          }, item.delay);
        });

        setTimeout(function () {
          var nav = document.querySelector('.pill-nav');
          if (nav) nav.classList.add('intro-nav-reveal');
        }, 250);

        sessionStorage.setItem('intro-d-played', '1');
      }

      /* ── Skip mechanism ────────────────────────────────── */
      function skipAll() {
        if (skipped) return;
        skipped = true;
        document.removeEventListener('click', skipAll);
        document.removeEventListener('keydown', skipAll);
        showContentNow();
        goAmbient();
      }

      document.addEventListener('click', skipAll);
      document.addEventListener('keydown', skipAll);
    })();
    </script>
</body>
</html>
