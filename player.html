<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <!-- Site styles (shared background, navbar, etc.) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icons/favicon.ico">
    <title>Yannick Gibson — Player</title>
    <style>
        .player-wrapper {
            position: relative;
            z-index: 1;
            padding-top: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
        }
        .player-frame {
            width: 90%;
            height: calc(100vh - 100px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.4);
            background: #1a1a2e;
        }
        .player-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Particles background (shared with landing) -->
    <div id="particles"></div>
    <div id="vignette"></div>
    <div id="cursor-spotlight"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-dark fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand" href="index.html">Yannick Gibson</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#games">Games</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="https://github.com/YannickGibson" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-github"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://www.linkedin.com/in/yannick-gibson" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Player -->
    <div class="player-wrapper">
        <div class="player-frame">
            <iframe id="subapp-frame" sandbox="allow-scripts allow-same-origin" title="Game"></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/particles.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var app = params.get('app');
            // Only allow local subapps paths
            if (app && /^subapps\/[\w.\-]+\.html$/.test(app)) {
                document.getElementById('subapp-frame').src = app;
                var name = app.replace(/^subapps\//, '').replace(/\.html$/, '');
                document.title = 'Yannick Gibson — ' + name.charAt(0).toUpperCase() + name.slice(1);
            }
        })();
    </script>
</body>
</html>
