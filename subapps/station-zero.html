<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STATION ZERO: REFRACTION</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; overflow: hidden; background: #020204; font-family: 'Orbitron', 'Segoe UI', sans-serif; color: #0f0; touch-action: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 12px; left: 12px; pointer-events: none; z-index: 10; }
        .hud-label { font-size: clamp(8px, 1.5vw, 10px); letter-spacing: 2px; margin-bottom: 4px; color: #0ff; text-transform: uppercase; }
        .bar-bg { width: clamp(120px, 25vw, 220px); height: 6px; background: rgba(0, 255, 0, 0.1); border: 1px solid rgba(0, 255, 0, 0.3); margin-bottom: 15px; position: relative; overflow: hidden; }
        #hp-bar { height: 100%; background: linear-gradient(90deg, #0f0, #004400); width: 100%; transition: width 0.3s; }
        #weapon-info { font-size: clamp(14px, 2.5vw, 20px); font-weight: bold; text-shadow: 0 0 10px #0ff; color: #fff; letter-spacing: 2px; }
        
        #progress-container { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: clamp(150px, 40vw, 300px); text-align: center; z-index: 10; }
        #progress-bar-inner { height: 4px; background: #0ff; width: 0%; transition: width 0.5s; box-shadow: 0 0 10px #0ff; }

        #level-text { position: absolute; top: 12px; right: 12px; z-index: 10; font-size: clamp(16px, 3vw, 24px); font-weight: bold; text-shadow: 0 0 10px #0f0; }
        #msg-popup { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); color: #0ff; font-size: clamp(14px, 3vw, 20px); display: none; z-index: 10; text-shadow: 0 0 15px #0ff; letter-spacing: 4px; animation: pulse 2s infinite; white-space: nowrap; }
        #overlay { position: absolute; inset: 0; background: radial-gradient(circle, #0a1010 0%, #000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        #overlay h1 { font-size: clamp(24px, 6vw, 48px); }
        button { background: transparent; color: #0f0; border: 2px solid #0f0; padding: 15px 40px; cursor: pointer; font-family: inherit; font-size: clamp(14px, 3vw, 20px); text-transform: uppercase; letter-spacing: 5px; transition: 0.3s; -webkit-tap-highlight-color: transparent; }
        button:hover, button:active { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }
        #hit-overlay { position: absolute; inset: 0; background: rgba(255, 0, 0, 0); pointer-events: none; z-index: 5; transition: background 0.1s; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* Mobile touch controls */
        #touch-move, #touch-aim { display: none; position: fixed; z-index: 20; pointer-events: auto; }
        #touch-move { bottom: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(0,255,0,0.08); border: 2px solid rgba(0,255,0,0.25); }
        #touch-move-knob { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(0,255,0,0.3); border: 1px solid rgba(0,255,0,0.5); }
        #touch-aim { bottom: 20px; right: 20px; width: 100px; height: 100px; border-radius: 50%; background: rgba(0,255,255,0.08); border: 2px solid rgba(0,255,255,0.25); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #0ff; font-weight: 700; letter-spacing: 1px; }
        @media (hover: none) and (pointer: coarse) { #touch-move, #touch-aim { display: flex; align-items: center; justify-content: center; } }
    </style>
</head>
<body>
    <div id="hit-overlay"></div>
    <div id="ui">
        <div class="hud-label">Core Stability</div>
        <div class="bar-bg"><div id="hp-bar"></div></div>
        <div class="hud-label">Tactical Overlay</div>
        <div id="weapon-info">PULSE BLASTER</div>
    </div>

    <div id="progress-container">
        <div class="hud-label">Mission Progress</div>
        <div class="bar-bg" style="width: 100%;"><div id="progress-bar-inner"></div></div>
    </div>

    <div id="level-text">SEC_01</div>
    <div id="msg-popup">EXTRACTION LINK ESTABLISHED</div>
    
    <div id="overlay">
        <div id="menu-content">
            <h1 style="letter-spacing: 15px; margin-bottom: 40px; font-size: 48px; color: #0f0; text-shadow: 0 0 20px #0f0; text-align: center;">STATION ZERO</h1>
            <div style="text-align: center;"><button id="start-btn">ENGAGE SYSTEMS</button></div>
        </div>
    </div>

    <canvas id="game"></canvas>

    <div id="touch-move"><div id="touch-move-knob"></div></div>
    <div id="touch-aim">FIRE</div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 64;
        const GRID_SIZE = 40; 
        const MAX_SECTORS = 10;

        let player = { x: 0, y: 0, angle: 0, hp: 100, speed: 350, radius: 18, weapon: 'blaster' };
        let map = [], enemies = [], bullets = [], enemyBullets = [], items = [], activeRays = [];
        let keys = {}, lastTime = 0, level = 1, extraction = null, audioCtx = null, gameActive = false;

        const WEAPONS = {
            blaster: { name: 'PULSE BLASTER', type: 'projectile', speed: 1200, dmg: 40, color: '#0ff', sfx: 400 },
            shotgun: { name: 'PLASMA SPREAD', type: 'projectile', speed: 1000, dmg: 25, color: '#f0f', sfx: 200, count: 5 },
            laser: { name: 'VOID BEAM', type: 'ray', bounces: 6, dmg: 120, color: '#ff0', sfx: 800, duration: 0.5 },
            railgun: { name: 'RAIL PIERCER', type: 'ray', bounces: 0, dmg: 300, color: '#fff', sfx: 1200, duration: 0.2 }
        };

        function playSfx(freq, type, dur, vol = 0.08) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + dur);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function triggerHitEffect() {
            const overlay = document.getElementById('hit-overlay');
            overlay.style.background = 'rgba(255, 0, 0, 0.4)';
            setTimeout(() => overlay.style.background = 'rgba(255, 0, 0, 0)', 100);
            playSfx(60, 'sawtooth', 0.2, 0.2);
        }

        function getBFSPath(startGrid, endGrid) {
            const queue = [[startGrid]];
            const visited = new Set([`${startGrid.x},${startGrid.y}`]);
            const dirs = [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}];
            while (queue.length > 0) {
                const path = queue.shift();
                const curr = path[path.length - 1];
                if (curr.x === endGrid.x && curr.y === endGrid.y) return path;
                for (const d of dirs) {
                    const next = { x: curr.x + d.x, y: curr.y + d.y };
                    if (next.x >= 0 && next.x < GRID_SIZE && next.y >= 0 && next.y < GRID_SIZE && 
                        map[next.y][next.x] === 0 && !visited.has(`${next.x},${next.y}`)) {
                        visited.add(`${next.x},${next.y}`);
                        queue.push([...path, next]);
                    }
                }
            }
            return null;
        }

        function generateMap() {
            if (level > MAX_SECTORS) {
                showWinScreen();
                return;
            }

            map = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(1));
            let x = 20, y = 20, steps = 1500;
            while (steps > 0) {
                map[y][x] = 0;
                let dir = Math.floor(Math.random() * 4);
                if (dir === 0 && x < GRID_SIZE - 3) x++;
                else if (dir === 1 && x > 2) x--;
                else if (dir === 2 && y < GRID_SIZE - 3) y++;
                else if (dir === 3 && y > 2) y--;
                steps--;
            }
            player.x = 20 * TILE_SIZE + 32; player.y = 20 * TILE_SIZE + 32;
            map[20][20] = 0;
            enemies = []; bullets = []; enemyBullets = []; items = []; activeRays = [];
            extraction = null;
            
            document.getElementById('msg-popup').style.display = 'none';
            document.getElementById('level-text').innerText = `SEC_${level < 10 ? '0' + level : level}`;
            document.getElementById('progress-bar-inner').style.width = ((level - 1) / MAX_SECTORS * 100) + '%';

            for(let i = 0; i < 8 + (level * 3); i++) {
                let ex = Math.floor(Math.random() * GRID_SIZE), ey = Math.floor(Math.random() * GRID_SIZE);
                if(map[ey][ex] === 0 && Math.hypot(ex*TILE_SIZE - player.x, ey*TILE_SIZE - player.y) > 400) {
                    const type = Math.random();
                    let en = { x: ex*TILE_SIZE+32, y: ey*TILE_SIZE+32, pulse: Math.random()*5, path: [], lastPathUpdate: 0 };
                    if (type < 0.4) { en.type = 'stalker'; en.hp = 60; en.speed = 130; en.color = '#f33'; en.size = 30; }
                    else if (type < 0.65) { en.type = 'tank'; en.hp = 200; en.speed = 70; en.color = '#f0f'; en.size = 50; }
                    else if (type < 0.85) { en.type = 'sentry'; en.hp = 50; en.speed = 90; en.color = '#ff8c00'; en.size = 35; en.shootTimer = 2; }
                    else { en.type = 'dasher'; en.hp = 40; en.speed = 260; en.color = '#ff0'; en.size = 22; }
                    enemies.push(en);
                }
            }
            gameActive = true;
        }

        function spawnExtraction() {
            let valid = false;
            let attempts = 0;
            while(!valid && attempts < 100) {
                // Spawn closer to player (between 150 and 400 pixels away)
                const dist = 150 + Math.random() * 250;
                const ang = Math.random() * Math.PI * 2;
                const ex = Math.floor((player.x + Math.cos(ang) * dist) / TILE_SIZE);
                const ey = Math.floor((player.y + Math.sin(ang) * dist) / TILE_SIZE);
                
                if(ey >= 0 && ey < GRID_SIZE && ex >= 0 && ex < GRID_SIZE && map[ey][ex] === 0) {
                    extraction = { x: ex * TILE_SIZE + 32, y: ey * TILE_SIZE + 32 };
                    valid = true;
                }
                attempts++;
            }
            // Fallback to random if no close spot found
            if (!valid) {
                while(!valid) {
                    let ex = Math.floor(Math.random() * GRID_SIZE), ey = Math.floor(Math.random() * GRID_SIZE);
                    if(map[ey][ex] === 0) {
                        extraction = { x: ex * TILE_SIZE + 32, y: ey * TILE_SIZE + 32 };
                        valid = true;
                    }
                }
            }
            document.getElementById('msg-popup').style.display = 'block';
            playSfx(440, 'sine', 0.6, 0.15);
        }

        function showWinScreen() {
            gameActive = false;
            document.getElementById('progress-bar-inner').style.width = '100%';
            const overlay = document.getElementById('overlay');
            const content = document.getElementById('menu-content');
            overlay.style.display = 'flex';
            content.innerHTML = `
                <h1 style="letter-spacing: 15px; margin-bottom: 20px; font-size: 48px; color: #0ff; text-shadow: 0 0 20px #0ff; text-align: center;">MISSION COMPLETE</h1>
                <p style="color: #0f0; letter-spacing: 3px; margin-bottom: 40px; text-align: center;">STATION ZERO HAS BEEN PURGED</p>
                <div style="text-align: center;"><button onclick="location.reload()">RE-INITIATE</button></div>
            `;
            playSfx(880, 'sine', 1, 0.2);
        }

        function isWall(x, y) {
            const gx = Math.floor(x / TILE_SIZE), gy = Math.floor(y / TILE_SIZE);
            return !map[gy] || map[gy][gx] === 1;
        }

        function castRay(startX, startY, angle, maxBounces, damage) {
            let curX = startX, curY = startY, curAngle = angle;
            const points = [{x: startX, y: startY}];
            const hitEnemies = new Set();
            for (let b = 0; b <= maxBounces; b++) {
                const vx = Math.cos(curAngle), vy = Math.sin(curAngle);
                let hit = false;
                for (let d = 4; d < 1500; d += 6) {
                    const tx = curX + vx * d;
                    const ty = curY + vy * d;
                    for(let i=enemies.length-1; i>=0; i--) {
                        if(!hitEnemies.has(i) && Math.hypot(tx - enemies[i].x, ty - enemies[i].y) < enemies[i].size/2) {
                            enemies[i].hp -= damage;
                            hitEnemies.add(i);
                            if (enemies[i].hp <= 0) {
                                if (Math.random() < 0.25) items.push({ x: enemies[i].x, y: enemies[i].y, type: ['shotgun', 'laser', 'railgun'][Math.floor(Math.random()*3)] });
                                enemies.splice(i, 1);
                            }
                        }
                    }
                    if (isWall(tx, ty)) {
                        points.push({x: tx, y: ty});
                        if (isWall(tx - vx*6, ty)) curAngle = Math.PI - curAngle; else curAngle = -curAngle;
                        curX = tx; curY = ty; hit = true; break;
                    }
                }
                if (!hit) { points.push({x: curX + vx*1500, y: curY + vy*1500}); break; }
            }
            return points;
        }

        function update(dt) {
            if (!gameActive) return;

            let mx = 0, my = 0;
            if (keys['KeyW']) my -= 1; if (keys['KeyS']) my += 1;
            if (keys['KeyA']) mx -= 1; if (keys['KeyD']) mx += 1;
            if (mx !== 0 || my !== 0) {
                const mag = Math.hypot(mx, my);
                const step = player.speed * dt;
                const nx = player.x + (mx/mag) * step, ny = player.y + (my/mag) * step;
                if (!isWall(nx - 12, player.y) && !isWall(nx + 12, player.y)) player.x = nx;
                if (!isWall(player.x, ny - 12) && !isWall(player.x, ny + 12)) player.y = ny;
            }

            items.forEach((it, i) => {
                if (Math.hypot(player.x - it.x, player.y - it.y) < 35) {
                    player.weapon = it.type;
                    document.getElementById('weapon-info').innerText = WEAPONS[it.type].name;
                    items.splice(i, 1);
                    playSfx(1000, 'sine', 0.2);
                }
            });
            activeRays.forEach((r, i) => { r.life -= dt; if (r.life <= 0) activeRays.splice(i, 1); });
            if (enemies.length === 0 && !extraction) spawnExtraction();
            if (extraction && Math.hypot(player.x - extraction.x, player.y - extraction.y) < 40) { level++; generateMap(); return; }

            const playerGrid = { x: Math.floor(player.x / TILE_SIZE), y: Math.floor(player.y / TILE_SIZE) };
            for (let i = enemies.length - 1; i >= 0; i--) {
                const en = enemies[i];
                en.pulse += dt * 5;
                if (performance.now() - en.lastPathUpdate > 500 || en.path.length === 0) {
                    const enGrid = { x: Math.floor(en.x / TILE_SIZE), y: Math.floor(en.y / TILE_SIZE) };
                    const newPath = getBFSPath(enGrid, playerGrid);
                    if (newPath) { en.path = newPath; en.path.shift(); }
                    en.lastPathUpdate = performance.now();
                }
                if (en.path.length > 0) {
                    const targetX = en.path[0].x * TILE_SIZE + 32;
                    const targetY = en.path[0].y * TILE_SIZE + 32;
                    const angle = Math.atan2(targetY - en.y, targetX - en.x);
                    en.x += Math.cos(angle) * en.speed * dt;
                    en.y += Math.sin(angle) * en.speed * dt;
                    if (Math.hypot(en.x - targetX, en.y - targetY) < 10) en.path.shift();
                }
                if (en.type === 'sentry') {
                    en.shootTimer -= dt;
                    if (en.shootTimer <= 0) {
                        const dist = Math.hypot(player.x - en.x, player.y - en.y);
                        if (dist < 600) {
                            const ang = Math.atan2(player.y - en.y, player.x - en.x);
                            enemyBullets.push({ x: en.x, y: en.y, angle: ang, speed: 500, dmg: 15 });
                            playSfx(200, 'sawtooth', 0.1);
                        }
                        en.shootTimer = 1.5 + Math.random();
                    }
                }
                if (Math.hypot(player.x - en.x, player.y - en.y) < player.radius + en.size/3) {
                    player.hp -= 40; triggerHitEffect(); enemies.splice(i, 1);
                }
            }

            bullets.forEach((b, i) => {
                b.x += Math.cos(b.angle) * b.speed * dt; b.y += Math.sin(b.angle) * b.speed * dt;
                if (isWall(b.x, b.y)) { bullets.splice(i, 1); return; }
                enemies.forEach((en, ei) => {
                    if (Math.hypot(b.x - en.x, b.y - en.y) < en.size/2 + 5) {
                        en.hp -= b.dmg; bullets.splice(i, 1);
                        if (en.hp <= 0) {
                            if (Math.random() < 0.25) items.push({ x: en.x, y: en.y, type: ['shotgun', 'laser', 'railgun'][Math.floor(Math.random()*3)] });
                            enemies.splice(ei, 1);
                        }
                    }
                });
            });

            enemyBullets.forEach((b, i) => {
                b.x += Math.cos(b.angle) * b.speed * dt; b.y += Math.sin(b.angle) * b.speed * dt;
                if (isWall(b.x, b.y)) { enemyBullets.splice(i, 1); return; }
                if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
                    player.hp -= b.dmg; triggerHitEffect(); enemyBullets.splice(i, 1);
                }
            });

            if (player.hp <= 0) { player.hp = 0; setTimeout(() => location.reload(), 500); }
            document.getElementById('hp-bar').style.width = Math.max(0, player.hp) + '%';
        }

        // --- Reusable fog canvas ---
        const fogCanvas = document.createElement('canvas');
        const fogCtx = fogCanvas.getContext('2d');

        function draw() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            fogCanvas.width = canvas.width; fogCanvas.height = canvas.height;
            ctx.save();
            ctx.translate(canvas.width/2 - player.x, canvas.height/2 - player.y);
            ctx.fillStyle = '#050508'; ctx.fillRect(0,0, GRID_SIZE*TILE_SIZE, GRID_SIZE*TILE_SIZE);
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (map[y][x] === 1) { 
                        ctx.fillStyle = '#111118'; ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#1a1a25'; ctx.strokeRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
            items.forEach(it => {
                ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Date.now()/500);
                ctx.fillStyle = WEAPONS[it.type].color; ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
                ctx.strokeRect(-12,-12,24,24); ctx.fillRect(-4,-4,8,8); ctx.restore();
            });
            if (extraction) {
                ctx.strokeStyle = '#0ff'; ctx.lineWidth = 4; ctx.shadowBlur = 20; ctx.shadowColor = '#0ff';
                ctx.strokeRect(extraction.x-30, extraction.y-30, 60, 60); ctx.shadowBlur = 0;
            }
            enemies.forEach(en => { 
                ctx.save(); ctx.translate(en.x, en.y); ctx.rotate(en.pulse/2);
                ctx.strokeStyle = en.color; ctx.lineWidth = en.type === 'sentry' ? 4 : 2;
                ctx.strokeRect(-en.size/2, -en.size/2, en.size, en.size);
                if (en.type === 'sentry') { ctx.fillStyle = en.color; ctx.fillRect(-4, -4, 8, 8); }
                ctx.restore();
            });
            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
            enemyBullets.forEach(b => { ctx.fillStyle = '#f00'; ctx.shadowBlur = 10; ctx.shadowColor = '#f00'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });
            activeRays.forEach(r => {
                ctx.strokeStyle = r.color; ctx.lineWidth = r.type === 'railgun' ? 6 : 3;
                ctx.globalAlpha = r.life / r.maxLife; ctx.shadowBlur = 20; ctx.shadowColor = r.color;
                ctx.beginPath(); ctx.moveTo(r.points[0].x, r.points[0].y);
                r.points.slice(1).forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            });
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            ctx.strokeStyle = '#0f0'; ctx.lineWidth = 3; ctx.strokeRect(-15, -15, 30, 30);
            ctx.fillStyle = '#fff'; ctx.fillRect(15, -3, 15, 6); ctx.restore(); ctx.restore();
            const target = extraction || (enemies.length > 0 ? enemies[0] : null);
            if (target) {
                const ang = Math.atan2(target.y - player.y, target.x - player.x);
                ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.rotate(ang);
                ctx.fillStyle = extraction ? '#0ff' : 'rgba(255,0,0,0.6)';
                ctx.beginPath(); ctx.moveTo(90, 0); ctx.lineTo(75, -8); ctx.lineTo(75, 8); ctx.fill(); ctx.restore();
            }
            fogCtx.fillStyle = 'rgba(0,0,0,0.92)'; fogCtx.fillRect(0,0,canvas.width,canvas.height);
            fogCtx.globalCompositeOperation = 'destination-out';
            const g = fogCtx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, 850);
            g.addColorStop(0, 'white'); g.addColorStop(1, 'transparent');
            fogCtx.save(); fogCtx.translate(canvas.width/2, canvas.height/2); fogCtx.rotate(player.angle);
            fogCtx.fillStyle = g; fogCtx.beginPath(); fogCtx.moveTo(0,0); fogCtx.arc(0,0,1300, -0.6, 0.6); fogCtx.fill();
            fogCtx.beginPath(); fogCtx.arc(550, 0, 300, 0, Math.PI*2); fogCtx.fill();
            fogCtx.restore(); fogCtx.beginPath(); fogCtx.arc(canvas.width/2, canvas.height/2, 280, 0, Math.PI*2); fogCtx.fill();
            fogCtx.globalCompositeOperation = 'source-over';
            ctx.drawImage(fogCanvas, 0, 0);
        }

        const _isMobile = ('ontouchstart' in window) && window.matchMedia('(hover: none) and (pointer: coarse)').matches;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousemove', e => player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2));
        window.addEventListener('mousedown', () => {
            if (!gameActive) return;
            fireWeapon();
        });

        function fireWeapon() {
            const w = WEAPONS[player.weapon];
            if (w.type === 'projectile') {
                const count = w.count || 1;
                for(let i=0; i<count; i++){
                    const spread = (i - (count-1)/2) * 0.15;
                    bullets.push({ x: player.x, y: player.y, angle: player.angle + spread, speed: w.speed, dmg: w.dmg, color: w.color });
                }
                playSfx(w.sfx, 'triangle', 0.1);
            } else {
                const pts = castRay(player.x, player.y, player.angle, w.bounces, w.dmg);
                activeRays.push({ points: pts, color: w.color, life: w.duration, maxLife: w.duration, type: player.weapon });
                playSfx(w.sfx, 'sine', 0.2, 0.1);
            }
        }

        // Mobile touch controls
        if (_isMobile) {
            const moveZone = document.getElementById('touch-move');
            const moveKnob = document.getElementById('touch-move-knob');
            const aimZone = document.getElementById('touch-aim');
            let moveTouchId = null;

            moveZone.addEventListener('touchstart', e => {
                e.preventDefault();
                moveTouchId = e.changedTouches[0].identifier;
            }, { passive: false });
            moveZone.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === moveTouchId) {
                        const rect = moveZone.getBoundingClientRect();
                        const cx = rect.left + rect.width / 2;
                        const cy = rect.top + rect.height / 2;
                        let dx = t.clientX - cx;
                        let dy = t.clientY - cy;
                        const maxR = rect.width / 2;
                        const dist = Math.hypot(dx, dy);
                        if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
                        moveKnob.style.marginLeft = (-20 + dx) + 'px';
                        moveKnob.style.marginTop = (-20 + dy) + 'px';

                        // Map joystick to keys
                        keys['KeyW'] = dy < -15;
                        keys['KeyS'] = dy > 15;
                        keys['KeyA'] = dx < -15;
                        keys['KeyD'] = dx > 15;

                        // Also aim in direction of movement
                        if (dist > 15) player.angle = Math.atan2(dy, dx);
                    }
                }
            }, { passive: false });
            const resetMove = () => {
                moveTouchId = null;
                moveKnob.style.marginLeft = '-20px';
                moveKnob.style.marginTop = '-20px';
                keys['KeyW'] = false; keys['KeyS'] = false;
                keys['KeyA'] = false; keys['KeyD'] = false;
            };
            moveZone.addEventListener('touchend', resetMove);
            moveZone.addEventListener('touchcancel', resetMove);

            // Fire button — auto-fire while held
            let fireInterval = null;
            aimZone.addEventListener('touchstart', e => {
                e.preventDefault();
                if (gameActive) fireWeapon();
                fireInterval = setInterval(() => { if (gameActive) fireWeapon(); }, 200);
            }, { passive: false });
            aimZone.addEventListener('touchend', () => { clearInterval(fireInterval); fireInterval = null; });
            aimZone.addEventListener('touchcancel', () => { clearInterval(fireInterval); fireInterval = null; });
        }

        document.getElementById('start-btn').onclick = () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('overlay').style.display = 'none';
            generateMap(); requestAnimationFrame(function l(t){ update(Math.min((t-lastTime)/1000, 0.1)); lastTime=t; draw(); requestAnimationFrame(l); });
        };
    </script>
</body>
